# -*- coding: utf-8 -*-
# vim: ft=yaml
---
driver:
  name: docker
  use_sudo: false
  privileged: true

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  formula: unbound
  minion_config:
    systemd_scope: false
  state_top:
    base:
      '*':
        - unbound
  pillars:
    top.sls:
      base:
        '*':
          - unbound
  pillars_from_files:
    unbound.sls: pillar.example
  salt_copy_filter:
    - .kitchen
    - .git

verifier:
  name: inspec
  sudo: true

platforms:
  - name: debian-12
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/debian-12:latest
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock
      volume:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: ubuntu-2204
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/ubuntu-2204:latest
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock
      volume:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: ubuntu-2404
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/ubuntu-2404:latest
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock
      volume:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: rockylinux-9
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/rockylinux-9:latest
      run_command: /usr/lib/systemd/systemd

  - name: amazonlinux-2023
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/amazonlinux-2023:latest
      run_command: /usr/lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock
      volume:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw

suites:
  - name: default
    verifier:
      inspec_tests:
        - test/integration/default
