# -*- coding: utf-8 -*-
# vim: ft=yaml
---
driver:
  name: docker
  use_sudo: false
  privileged: true
  cgroupns_mode: private

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: unbound
  minion_config:
    systemd:
      scope: false
  state_top:
    base:
      '*':
        - unbound
  pillars:
    top.sls:
      base:
        '*':
          - unbound
  pillars_from_files:
    unbound.sls: pillar.example
  salt_copy_filter:
    - .kitchen
    - .git

verifier:
  name: inspec
  sudo: true

platforms:
  - name: debian-12
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-debian-12:latest
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: ubuntu-2204
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-ubuntu-2204:latest
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: ubuntu-2404
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-ubuntu-2404:latest
      run_command: /lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: rockylinux-9
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-rockylinux-9:latest
      run_command: /usr/lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: amazonlinux-2023
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-amazonlinux-2023:latest
      run_command: /usr/lib/systemd/systemd
      username: root
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock
    transport:
      name: docker
      username: root
      temp_dir: /var/tmp
    provisioner:
      root_path: /var/tmp/kitchen
      sudo: false
    verifier:
      root_path: /var/tmp/verifier
      sudo: false

  - name: centos-stream-9
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-centos-stream-9:latest
      run_command: /usr/lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: almalinux-9
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-almalinux-9:latest
      run_command: /usr/lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

  - name: opensuse-leap-15
    driver:
      image: ghcr.io/someblackmagic/salt-unbound-formula/kitchen-opensuse-leap-15:latest
      run_command: /usr/lib/systemd/systemd
      env:
        - container=docker
      tmpfs:
        - /run
        - /run/lock

suites:
  - name: default
    verifier:
      inspec_tests:
        - test/integration/default
