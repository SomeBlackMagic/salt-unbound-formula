# -*- coding: utf-8 -*-
# vim: ft=yaml
---
name: CI

'on':
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/salt-unbound-formula

jobs:
  lint:
    name: Lint (${{ matrix.lint-tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lint-tool:
          - yamllint
          - salt-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        if: matrix.lint-tool == 'yamllint'
        run: pip install yamllint>=1.26.0

      - name: Run yamllint
        if: matrix.lint-tool == 'yamllint'
        run: yamllint -s .

      - name: Install salt-lint
        if: matrix.lint-tool == 'salt-lint'
        run: pip install salt-lint

      - name: Run salt-lint
        if: matrix.lint-tool == 'salt-lint'
        # Only lint .sls files — .jinja files are config templates, not Salt states
        run: |
          git ls-files -- '*.sls' | xargs --no-run-if-empty salt-lint

  kitchen:
    name: Kitchen (${{ matrix.instance }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        instance:
          - default-debian-12
          - default-ubuntu-2204
          - default-ubuntu-2404
          - default-rockylinux-9
          - default-amazonlinux-2023
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Run kitchen test
        run: bundle exec kitchen test ${{ matrix.instance }} --destroy=always
        env:
          CHEF_LICENSE: accept-no-persist
