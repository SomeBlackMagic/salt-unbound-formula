# -*- coding: utf-8 -*-
# vim: ft=yaml
---
name: Build Kitchen Images

'on':
  workflow_dispatch: ~

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/salt-unbound-formula

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - kitchen-debian-12
          - kitchen-ubuntu-2204
          - kitchen-ubuntu-2404
          - kitchen-rockylinux-9
          - kitchen-amazonlinux-2023
          - kitchen-centos-stream-9
          - kitchen-almalinux-9
          - kitchen-opensuse-leap-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.platform }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: docker/${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.platform }}:latest
          cache-to: type=inline
