# -*- coding: utf-8 -*-
# vim: ft=yaml
---
name: Build Kitchen Images

'on':
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (leave empty to build all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - debian-12
          - ubuntu-2204
          - ubuntu-2404
          - rockylinux-9
          - amazonlinux-2023

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/salt-unbound-formula

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian-12
          - ubuntu-2204
          - ubuntu-2404
          - rockylinux-9
          - amazonlinux-2023
    steps:
      - name: Skip if specific platform requested and this is not it
        if: inputs.platform != '' && inputs.platform != matrix.platform
        run: |
          echo "Skipping ${{ matrix.platform }} (requested: ${{ inputs.platform }})"
          exit 0

      - name: Checkout
        if: inputs.platform == '' || inputs.platform == matrix.platform
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: inputs.platform == '' || inputs.platform == matrix.platform
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: inputs.platform == '' || inputs.platform == matrix.platform
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.platform }}
        if: inputs.platform == '' || inputs.platform == matrix.platform
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.platform }}:latest
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.platform }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.platform }}:latest
          cache-to: type=inline
